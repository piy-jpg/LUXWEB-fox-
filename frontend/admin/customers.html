<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Client Directory — Lumière Admin</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,400&family=Montserrat:wght@200;300;400;500;600&display=swap" rel="stylesheet" />
  
  <link rel="stylesheet" href="css/admin.css" />
</head>
<body>

  <aside class="admin-sidebar" id="adminSidebar"></aside>

  <div class="admin-main">
    <header class="admin-topbar" id="adminTopbar"></header>

    <main class="admin-content">
      <div style="display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 2rem;">
        <div>
          <span style="font-size: 0.72rem; letter-spacing: 0.12em; color: var(--color-gold); text-transform: uppercase;">Customer Relations</span>
          <h1 style="font-family: var(--font-serif); font-size: 2.2rem; font-weight: 300; margin: 0.35rem 0 0;">Prestige Client Directory</h1>
        </div>
      </div>

      <!-- Search Toolbar -->
      <div class="table-card" style="padding: 1.25rem; margin-bottom: 1.5rem;">
        <input type="text" id="custSearch" class="admin-input" placeholder="Search clients by name, email, or telephone..." style="width: 100%; max-width: 450px;" oninput="debounceCustSearch()" />
      </div>

      <!-- Client Table -->
      <div class="table-card">
        <div class="table-responsive">
          <table class="admin-table">
            <thead>
              <tr>
                <th>Client</th>
                <th>Phone</th>
                <th>Total Orders</th>
                <th>Lifetime Spend</th>
                <th>Member Since</th>
                <th>Status</th>
                <th style="text-align: right;">Action</th>
              </tr>
            </thead>
            <tbody id="customersTableBody">
              <tr><td colspan="7" style="text-align: center;">Loading client directory...</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </main>
  </div>

  <!-- CUSTOMER DETAILS MODAL -->
  <div class="admin-modal" id="customerModal" style="max-width: 650px;">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; border-bottom: 1px solid var(--admin-border); padding-bottom: 1rem;">
      <h3 style="font-family: var(--font-serif); font-size: 1.6rem; margin: 0;" id="custModalName">Client Profile</h3>
      <button onclick="Admin.closeModal('customerModal')" style="background: none; border: none; color: #fff; font-size: 1.5rem; cursor: pointer;">&times;</button>
    </div>
    <div id="custModalBody">Loading details...</div>
  </div>

  <div class="admin-backdrop" id="adminBackdrop" onclick="Admin.closeModal('customerModal')"></div>

  <script src="../js/auth.js"></script>
  <script src="js/admin.js"></script>
  <script>
    let customersList = [];
    let custSearchTimeout = null;

    function debounceCustSearch() {
      clearTimeout(custSearchTimeout);
      custSearchTimeout = setTimeout(loadCustomers, 300);
    }

    async function loadCustomers() {
      const search = document.getElementById('custSearch').value.trim();

      try {
        const q = search ? `?search=${encodeURIComponent(search)}` : '';
        const res = await Auth.apiFetch(`/api/admin/customers${q}`);
        const data = await res.json();

        if (data.success) {
          customersList = data.customers;
          const tbody = document.getElementById('customersTableBody');

          if (customersList.length === 0) {
            tbody.innerHTML = '<tr><td colspan="7" style="text-align: center; color: rgba(250,247,242,0.5);">No registered clients found.</td></tr>';
            return;
          }

          tbody.innerHTML = customersList.map(c => `
            <tr>
              <td>
                <div style="font-weight: 600; color: #fff;">${c.first_name || ''} ${c.last_name || ''}</div>
                <div style="font-size: 0.72rem; color: rgba(250,247,242,0.5);">${c.email}</div>
              </td>
              <td style="color: rgba(250,247,242,0.7);">${c.phone || '—'}</td>
              <td style="font-weight: 500;">${c.order_count} order(s)</td>
              <td style="color: var(--color-gold); font-weight: 600; font-size: 0.95rem;">$${parseFloat(c.total_spent).toFixed(2)}</td>
              <td style="font-size: 0.72rem; color: rgba(250,247,242,0.6);">${new Date(c.created_at).toLocaleDateString()}</td>
              <td><span class="badge badge-active">${c.status}</span></td>
              <td style="text-align: right;">
                <button onclick="viewCustomerDetails(${c.id})" class="btn-outline" style="padding: 0.35rem 0.75rem; font-size: 0.68rem;">View Dossier &rarr;</button>
              </td>
            </tr>
          `).join('');
        }
      } catch (err) {
        console.error('Customers error:', err);
      }
    }

    async function viewCustomerDetails(id) {
      Admin.openModal('customerModal');
      const body = document.getElementById('custModalBody');
      body.innerHTML = '<p style="text-align: center;">Loading client dossier...</p>';

      try {
        const res = await Auth.apiFetch(`/api/admin/customers/${id}`);
        const data = await res.json();

        if (data.success) {
          const c = data.customer;
          document.getElementById('custModalName').innerText = `${c.first_name || ''} ${c.last_name || ''}`;

          body.innerHTML = `
            <div style="margin-bottom: 1.5rem; background: rgba(255,255,255,0.03); padding: 1rem; border-radius: 4px;">
              <div style="font-size: 0.8rem; margin-bottom: 0.35rem;"><strong>Email:</strong> ${c.email}</div>
              <div style="font-size: 0.8rem; margin-bottom: 0.35rem;"><strong>Telephone:</strong> ${c.phone || 'Not provided'}</div>
              <div style="font-size: 0.8rem;"><strong>Member Since:</strong> ${new Date(c.created_at).toLocaleDateString()}</div>
            </div>

            <div style="margin-bottom: 1.5rem;">
              <div style="font-size: 0.72rem; color: var(--color-gold); text-transform: uppercase; font-weight: 600; margin-bottom: 0.5rem;">Purchase History (${c.orders.length})</div>
              ${c.orders.length === 0 ? '<p style="font-size: 0.8rem; color: rgba(250,247,242,0.5);">No purchases recorded yet.</p>' : `
                <div class="table-responsive">
                  <table class="admin-table">
                    <thead>
                      <tr>
                        <th>Order</th>
                        <th>Total</th>
                        <th>Status</th>
                        <th>Date</th>
                      </tr>
                    </thead>
                    <tbody>
                      ${c.orders.map(o => `
                        <tr>
                          <td><strong>#${o.order_number}</strong></td>
                          <td style="color: var(--color-gold); font-weight: 500;">$${parseFloat(o.total_amount).toFixed(2)}</td>
                          <td><span class="badge badge-active">${o.status}</span></td>
                          <td style="font-size: 0.72rem;">${new Date(o.created_at).toLocaleDateString()}</td>
                        </tr>
                      `).join('')}
                    </tbody>
                  </table>
                </div>
              `}
            </div>
          `;
        }
      } catch (err) {
        body.innerHTML = '<p style="color: #FF8A9E;">Failed to load customer dossier.</p>';
      }
    }

    document.addEventListener('DOMContentLoaded', loadCustomers);
  </script>
</body>
</html>
