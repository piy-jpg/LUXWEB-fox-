<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Order Management — Lumière Admin</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,400&family=Montserrat:wght@200;300;400;500;600&display=swap" rel="stylesheet" />
  
  <link rel="stylesheet" href="css/admin.css" />
</head>
<body>

  <aside class="admin-sidebar" id="adminSidebar"></aside>

  <div class="admin-main">
    <header class="admin-topbar" id="adminTopbar"></header>

    <main class="admin-content">
      <div style="display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 2rem;">
        <div>
          <span style="font-size: 0.72rem; letter-spacing: 0.12em; color: var(--color-gold); text-transform: uppercase;">Fulfillment Operations</span>
          <h1 style="font-family: var(--font-serif); font-size: 2.2rem; font-weight: 300; margin: 0.35rem 0 0;">Customer Orders &amp; Dispatch</h1>
        </div>
      </div>

      <!-- Filters & Search -->
      <div class="table-card" style="padding: 1.25rem; margin-bottom: 1.5rem; display: flex; gap: 1rem; flex-wrap: wrap;">
        <input type="text" id="orderSearch" class="admin-input" placeholder="Search order number, client name, or email..." style="flex: 2; min-width: 250px;" oninput="debounceOrderSearch()" />
        <select id="statusFilter" class="admin-select" style="flex: 1; min-width: 160px;" onchange="loadOrders()">
          <option value="all">All Order Statuses</option>
          <option value="Pending">Pending</option>
          <option value="Confirmed">Confirmed</option>
          <option value="Processing">Processing</option>
          <option value="Shipped">Shipped</option>
          <option value="Delivered">Delivered</option>
          <option value="Cancelled">Cancelled</option>
        </select>
      </div>

      <!-- Orders Table -->
      <div class="table-card">
        <div class="table-responsive">
          <table class="admin-table">
            <thead>
              <tr>
                <th>Order #</th>
                <th>Client</th>
                <th>Items</th>
                <th>Total</th>
                <th>Status</th>
                <th>Tracking</th>
                <th>Date</th>
                <th style="text-align: right;">Action</th>
              </tr>
            </thead>
            <tbody id="ordersTableBody">
              <tr><td colspan="8" style="text-align: center;">Loading orders...</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </main>
  </div>

  <!-- ORDER DETAILS MODAL -->
  <div class="admin-modal" id="orderModal" style="max-width: 700px;">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; border-bottom: 1px solid var(--admin-border); padding-bottom: 1rem;">
      <div>
        <h3 style="font-family: var(--font-serif); font-size: 1.6rem; margin: 0;" id="modalOrderNumber">Order #LUM-2026</h3>
        <div style="font-size: 0.75rem; color: rgba(250,247,242,0.6);" id="modalOrderDate">Date Placed</div>
      </div>
      <button onclick="Admin.closeModal('orderModal')" style="background: none; border: none; color: #fff; font-size: 1.5rem; cursor: pointer;">&times;</button>
    </div>

    <div id="modalOrderContent">Loading details...</div>
  </div>

  <div class="admin-backdrop" id="adminBackdrop" onclick="Admin.closeModal('orderModal')"></div>

  <script src="../js/auth.js"></script>
  <script src="js/admin.js"></script>
  <script>
    let ordersList = [];
    let orderSearchTimeout = null;
    let lastOrdersFingerprint = '';
    let realTimeOrdersTimer = null;

    function debounceOrderSearch() {
      clearTimeout(orderSearchTimeout);
      orderSearchTimeout = setTimeout(() => loadOrders(false), 300);
    }

    async function loadOrders(isSilent = false) {
      const urlParams = new URLSearchParams(window.location.search);
      const urlStatus = urlParams.get('status');
      const statusSelect = document.getElementById('statusFilter');
      if (urlStatus && statusSelect && !statusSelect.dataset.userChanged) {
        statusSelect.value = urlStatus;
      }

      const search = document.getElementById('orderSearch').value.trim();
      const status = statusSelect ? statusSelect.value : 'all';

      try {
        const q = new URLSearchParams();
        if (search) q.append('search', search);
        if (status !== 'all') q.append('status', status);

        const res = await Auth.apiFetch(`/api/admin/orders?${q.toString()}`);
        const data = await res.json();

        if (data.success) {
          const orders = data.orders || [];
          const fingerprint = `${orders.length}_${orders.map(o => `${o.id}:${o.status}:${o.tracking_number}`).join(';')}`;

          if (isSilent && fingerprint === lastOrdersFingerprint) {
            return;
          }
          lastOrdersFingerprint = fingerprint;
          ordersList = orders;

          const tbody = document.getElementById('ordersTableBody');

          if (ordersList.length === 0) {
            tbody.innerHTML = '<tr><td colspan="8" style="text-align: center; color: rgba(250,247,242,0.5);">No orders matched your criteria.</td></tr>';
            return;
          }

          const canUpdateOrder = Auth.hasPermission('orders.update');

          tbody.innerHTML = ordersList.map(o => {
            const statusSelectHtml = canUpdateOrder
              ? `
                <select class="admin-select" style="padding: 0.3rem 0.5rem; font-size: 0.72rem;" onchange="updateStatus(${o.id}, this.value)">
                  <option value="Pending" ${o.status === 'Pending' ? 'selected' : ''}>Pending</option>
                  <option value="Confirmed" ${o.status === 'Confirmed' ? 'selected' : ''}>Confirmed</option>
                  <option value="Processing" ${o.status === 'Processing' ? 'selected' : ''}>Processing</option>
                  <option value="Shipped" ${o.status === 'Shipped' ? 'selected' : ''}>Shipped</option>
                  <option value="Delivered" ${o.status === 'Delivered' ? 'selected' : ''}>Delivered</option>
                  <option value="Cancelled" ${o.status === 'Cancelled' ? 'selected' : ''}>Cancelled</option>
                </select>
              `
              : `
                <span class="badge badge-${o.status.toLowerCase()}">${o.status}</span>
              `;

            return `
              <tr>
                <td><strong style="color: #fff;">#${o.order_number}</strong></td>
                <td>
                  <div style="font-weight: 500;">${o.customer_name}</div>
                  <div style="font-size: 0.7rem; color: rgba(250,247,242,0.5);">${o.customer_email}</div>
                </td>
                <td>${o.total_items || 1} item(s)</td>
                <td style="color: var(--color-gold); font-weight: 600;">$${parseFloat(o.total_amount).toFixed(2)}</td>
                <td>${statusSelectHtml}</td>
                <td style="font-family: monospace; font-size: 0.72rem; color: rgba(250,247,242,0.7);">${o.tracking_number || '—'}</td>
                <td style="font-size: 0.72rem; color: rgba(250,247,242,0.5);">${new Date(o.created_at).toLocaleDateString()}</td>
                <td style="text-align: right;">
                  <button onclick="openOrderModal(${o.id})" class="btn-outline" style="padding: 0.35rem 0.75rem; font-size: 0.68rem;">View &rarr;</button>
                </td>
              </tr>
            `;
          }).join('');
        }
      } catch (err) {
        console.error('Orders error:', err);
      }
    }

    async function updateStatus(orderId, newStatus) {
      if (!Auth.hasPermission('orders.update')) {
        Admin.toast('⚠️ Order dispatch updates require Order Staff, Manager, or Owner role.');
        return;
      }
      try {
        const res = await Auth.apiFetch(`/api/admin/orders/${orderId}/status`, {
          method: 'PUT',
          body: JSON.stringify({ status: newStatus }),
        });
        const data = await res.json();
        if (data.success) {
          Admin.toast(`✦ Order #${orderId} status updated to ${newStatus}`);
          loadOrders(false);
        } else {
          alert(data.error || 'Failed to update order status');
          loadOrders(false);
        }
      } catch (err) {
        alert(err.message);
        loadOrders(false);
      }
    }

    async function openOrderModal(orderId) {
      Admin.openModal('orderModal');
      const content = document.getElementById('modalOrderContent');
      content.innerHTML = '<p style="text-align: center;">Loading order details...</p>';

      try {
        const res = await Auth.apiFetch(`/api/admin/orders/${orderId}`);
        const data = await res.json();

        if (data.success) {
          const o = data.order;
          document.getElementById('modalOrderNumber').innerText = `Order #${o.order_number}`;
          document.getElementById('modalOrderDate').innerText = `Placed on ${new Date(o.created_at).toLocaleString()}`;

          content.innerHTML = `
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem; margin-bottom: 1.5rem;">
              <div style="background: rgba(255,255,255,0.03); padding: 1rem; border-radius: 4px;">
                <div style="font-size: 0.7rem; color: rgba(250,247,242,0.6); text-transform: uppercase;">Client Profile</div>
                <div style="font-weight: 600; margin-top: 0.25rem;">${o.customer_name}</div>
                <div style="font-size: 0.8rem; color: rgba(250,247,242,0.7);">${o.customer_email}</div>
              </div>
              <div style="background: rgba(255,255,255,0.03); padding: 1rem; border-radius: 4px;">
                <div style="font-size: 0.7rem; color: rgba(250,247,242,0.6); text-transform: uppercase;">Delivery Address</div>
                <div style="font-size: 0.8rem; color: rgba(250,247,242,0.85); margin-top: 0.25rem;">
                  ${o.shippingAddress.address || o.shippingAddress.text || 'Standard Concierge Delivery'}
                </div>
              </div>
            </div>

            <div style="margin-bottom: 1.5rem;">
              <div style="font-size: 0.72rem; color: var(--color-gold); text-transform: uppercase; margin-bottom: 0.5rem; font-weight: 600;">Purchased Items</div>
              <div class="table-responsive">
                <table class="admin-table" style="background: rgba(0,0,0,0.2);">
                  <thead>
                    <tr>
                      <th>Product</th>
                      <th>SKU</th>
                      <th>Qty</th>
                      <th>Price</th>
                      <th>Total</th>
                    </tr>
                  </thead>
                  <tbody>
                    ${o.items.map(item => `
                      <tr>
                        <td>
                          <div style="display: flex; align-items: center; gap: 0.5rem;">
                            <img src="../${item.product_image || 'images/skincare_products_1788328338930.jpg'}" alt="${item.product_name}" style="width: 32px; height: 32px; object-fit: cover; border-radius: 2px;" />
                            <span>${item.product_name}</span>
                          </div>
                        </td>
                        <td style="font-family: monospace; font-size: 0.72rem;">${item.sku}</td>
                        <td>${item.quantity}</td>
                        <td>$${parseFloat(item.unit_price).toFixed(2)}</td>
                        <td style="font-weight: 600; color: var(--color-gold);">$${parseFloat(item.total_price).toFixed(2)}</td>
                      </tr>
                    `).join('')}
                  </tbody>
                </table>
              </div>
            </div>

            <div style="background: rgba(255,255,255,0.03); padding: 1rem; border-radius: 4px; margin-bottom: 1.5rem;">
              <label style="display: block; font-size: 0.7rem; text-transform: uppercase; margin-bottom: 0.35rem;">Carrier Tracking Number</label>
              <div style="display: flex; gap: 0.5rem;">
                <input type="text" id="modalTrackingInput" class="admin-input" style="flex: 1;" value="${o.tracking_number || ''}" placeholder="e.g. 1Z9999999999999999" />
                <button onclick="saveTracking(${o.id})" class="btn-gold" style="padding: 0.4rem 0.8rem; font-size: 0.7rem;">SAVE TRACKING</button>
              </div>
            </div>

            <div style="display: flex; justify-content: space-between; align-items: center; border-top: 1px solid var(--admin-border); padding-top: 1rem;">
              <div>
                <span style="font-size: 0.75rem; color: rgba(250,247,242,0.6);">Payment:</span>
                <strong style="color: #7bed9f; margin-left: 0.35rem;">${o.payment_status}</strong>
              </div>
              <div>
                <span style="font-size: 0.85rem; color: rgba(250,247,242,0.6);">Grand Total:</span>
                <strong style="font-family: var(--font-serif); font-size: 1.5rem; color: var(--color-gold); margin-left: 0.5rem;">$${parseFloat(o.total_amount).toFixed(2)}</strong>
              </div>
            </div>
          `;
        }
      } catch (err) {
        content.innerHTML = '<p style="color: #FF8A9E;">Failed to load order details.</p>';
      }
    }

    async function saveTracking(orderId) {
      const trackingNumber = document.getElementById('modalTrackingInput').value.trim();
      try {
        const res = await Auth.apiFetch(`/api/admin/orders/${orderId}/status`, {
          method: 'PUT',
          body: JSON.stringify({ status: 'Shipped', trackingNumber }),
        });
        const data = await res.json();
        if (data.success) {
          Admin.toast('Tracking number updated and order marked Shipped.');
          loadOrders();
          openOrderModal(orderId);
        }
      } catch (err) {
        alert(err.message);
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      loadOrders(false);
      if (realTimeOrdersTimer) clearInterval(realTimeOrdersTimer);
      realTimeOrdersTimer = setInterval(() => {
        const activeEl = document.activeElement;
        const isTyping = activeEl && (activeEl.tagName === 'INPUT' || activeEl.tagName === 'TEXTAREA' || activeEl.tagName === 'SELECT');
        const modalOpen = document.getElementById('orderModal') && document.getElementById('orderModal').classList.contains('open');
        if (!isTyping && !modalOpen) {
          loadOrders(true);
        }
      }, 5000);
      window.addEventListener('focus', () => loadOrders(true));
    });
  </script>
</body>
</html>
