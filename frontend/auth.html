<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Authentication — Lumière Luxury Beauty</title>
  <meta name="description" content="Sign in or create your Lumière personal account to access order tracking, bespoke edits, and complimentary concierge delivery." />
  
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,400&family=Montserrat:wght@200;300;400;500;600&display=swap" rel="stylesheet" />
  
  <link rel="stylesheet" href="css/lumiere-cinematic.css" />
  
  <style>
    .auth-page-wrap {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      background: radial-gradient(circle at 50% 15%, rgba(201, 169, 110, 0.08) 0%, rgba(18, 13, 15, 0) 65%), #120D0F;
      position: relative;
    }

    .auth-container {
      max-width: 480px;
      width: 100%;
      margin: 4rem auto 5rem;
      padding: 2.5rem;
      background: rgba(24, 19, 21, 0.85);
      border: 1px solid rgba(201, 169, 110, 0.25);
      border-radius: 4px;
      backdrop-filter: blur(20px);
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.8);
      position: relative;
      z-index: 10;
    }

    .auth-tabs {
      display: flex;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      margin-bottom: 2rem;
    }

    .auth-tab-btn {
      flex: 1;
      padding: 0.85rem 0;
      background: transparent;
      border: none;
      font-family: var(--font-serif);
      font-size: 1.15rem;
      color: rgba(250, 247, 242, 0.5);
      cursor: pointer;
      position: relative;
      transition: all 0.3s ease;
      text-align: center;
    }

    .auth-tab-btn.active {
      color: var(--color-gold);
      font-weight: 500;
    }

    .auth-tab-btn.active::after {
      content: '';
      position: absolute;
      bottom: -1px;
      left: 0;
      width: 100%;
      height: 2px;
      background: var(--color-gold);
      box-shadow: 0 0 12px rgba(201, 169, 110, 0.6);
    }

    .form-group {
      margin-bottom: 1.35rem;
      text-align: left;
    }

    .form-label {
      display: block;
      font-size: 0.72rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: rgba(250, 247, 242, 0.75);
      margin-bottom: 0.45rem;
    }

    .form-input {
      width: 100%;
      padding: 0.85rem 1rem;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 2px;
      color: var(--color-cream);
      font-family: var(--font-sans);
      font-size: 0.88rem;
      transition: all 0.3s ease;
      box-sizing: border-box;
    }

    .form-input:focus {
      outline: none;
      border-color: var(--color-gold);
      background: rgba(255, 255, 255, 0.06);
      box-shadow: 0 0 15px rgba(201, 169, 110, 0.2);
    }

    .auth-btn-primary {
      width: 100%;
      padding: 0.95rem;
      background: var(--color-gold);
      color: #120D0F;
      border: 1px solid var(--color-gold);
      font-family: var(--font-sans);
      font-size: 0.78rem;
      font-weight: 600;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      cursor: pointer;
      transition: all 0.3s ease;
      margin-top: 1rem;
      box-shadow: 0 4px 15px rgba(201, 169, 110, 0.25);
    }

    .auth-btn-primary:hover {
      background: #E0C79B;
      border-color: #E0C79B;
      transform: translateY(-1px);
      box-shadow: 0 6px 20px rgba(201, 169, 110, 0.4);
    }

    .auth-footer-link {
      margin-top: 1.25rem;
      text-align: center;
      font-size: 0.78rem;
      color: rgba(250, 247, 242, 0.6);
    }

    .auth-footer-link a {
      color: var(--color-gold);
      text-decoration: none;
      cursor: pointer;
      transition: color 0.2s;
    }

    .auth-footer-link a:hover {
      text-decoration: underline;
    }

    .demo-accounts-card {
      margin-top: 2rem;
      padding: 1.25rem;
      background: rgba(201, 169, 110, 0.04);
      border: 1px dashed rgba(201, 169, 110, 0.25);
      border-radius: 4px;
      font-size: 0.78rem;
      color: rgba(250, 247, 242, 0.7);
    }

    .demo-btn-group {
      display: flex;
      gap: 0.5rem;
      margin-top: 0.75rem;
    }

    .demo-btn {
      flex: 1;
      padding: 0.4rem 0.6rem;
      font-size: 0.7rem;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: rgba(250, 247, 242, 0.85);
      cursor: pointer;
      border-radius: 2px;
      transition: all 0.2s ease;
    }

    .demo-btn:hover {
      background: rgba(201, 169, 110, 0.15);
      border-color: var(--color-gold);
      color: var(--color-gold);
    }
  </style>
</head>
<body class="auth-page-wrap">

  <!-- Minimal Brand Header -->
  <header style="padding: 2rem; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid rgba(255,255,255,0.06);">
    <a href="index.html" class="nav-brand" style="text-decoration: none; display: flex; align-items: center; gap: 0.5rem;">
      <span style="color: var(--color-gold);">✦</span>
      <span style="font-family: var(--font-serif); font-size: 1.4rem; color: #fff; letter-spacing: 0.05em;">Lumière</span>
    </a>
    <a href="index.html" style="font-size: 0.78rem; letter-spacing: 0.1em; text-transform: uppercase; color: rgba(250,247,242,0.6); text-decoration: none; display: flex; align-items: center; gap: 0.4rem;">
      <span>&larr;</span>
      <span>Back to Boutique</span>
    </a>
  </header>

  <!-- Auth Form Container -->
  <main class="auth-container">
    
    <!-- Tab Controls -->
    <div class="auth-tabs">
      <button class="auth-tab-btn active" id="tabSignIn" onclick="switchAuthTab('signin')">Sign In</button>
      <button class="auth-tab-btn" id="tabRegister" onclick="switchAuthTab('register')">Create Account</button>
    </div>

    <!-- Alert Banner -->
    <div id="authAlert" style="display: none; padding: 0.75rem 1rem; margin-bottom: 1.25rem; font-size: 0.8rem; border-radius: 2px;"></div>

    <!-- 1. SIGN IN FORM -->
    <form id="signInForm" onsubmit="handleSignIn(event)">
      <div class="form-group">
        <label class="form-label" for="loginEmail">Email Address</label>
        <input type="email" id="loginEmail" class="form-input" placeholder="e.g. eleonore@lumiere.com" required autocomplete="email" />
      </div>

      <div class="form-group">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.45rem;">
          <label class="form-label" for="loginPassword" style="margin-bottom: 0;">Password</label>
          <a onclick="switchAuthTab('forgot')" style="font-size: 0.72rem; color: var(--color-gold); cursor: pointer;">Forgot Password?</a>
        </div>
        <input type="password" id="loginPassword" class="form-input" placeholder="••••••••••••" required autocomplete="current-password" />
      </div>

      <button type="submit" class="auth-btn-primary" id="loginSubmitBtn">
        SIGN IN &rarr;
      </button>

      <!-- Preloaded Demo Switcher -->
      <div class="demo-accounts-card">
        <div style="font-weight: 500; color: var(--color-gold);">Quick Test Credentials:</div>
        <div class="demo-btn-group">
          <button type="button" class="demo-btn" onclick="fillDemo('customer@lumiere.com', 'Lumiere2026!')">
            Customer Demo
          </button>
          <button type="button" class="demo-btn" onclick="fillDemo('owner@lumiere.com', 'LumiereOwner2026!')">
            Owner / Admin
          </button>
        </div>
      </div>
    </form>

    <!-- 2. REGISTER FORM -->
    <form id="registerForm" onsubmit="handleRegister(event)" style="display: none;">
      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem;">
        <div class="form-group">
          <label class="form-label" for="regFirstName">First Name</label>
          <input type="text" id="regFirstName" class="form-input" placeholder="Camille" required />
        </div>
        <div class="form-group">
          <label class="form-label" for="regLastName">Last Name</label>
          <input type="text" id="regLastName" class="form-input" placeholder="Rousseau" required />
        </div>
      </div>

      <div class="form-group">
        <label class="form-label" for="regEmail">Email Address</label>
        <input type="email" id="regEmail" class="form-input" placeholder="camille@example.com" required autocomplete="email" />
      </div>

      <div class="form-group">
        <label class="form-label" for="regPhone">Phone (Optional)</label>
        <input type="tel" id="regPhone" class="form-input" placeholder="+1 (555) 000-0000" />
      </div>

      <div class="form-group">
        <label class="form-label" for="regPassword">Password (8+ chars)</label>
        <input type="password" id="regPassword" class="form-input" placeholder="••••••••••••" required minlength="8" />
      </div>

      <button type="submit" class="auth-btn-primary" id="registerSubmitBtn">
        CREATE ACCOUNT &rarr;
      </button>

      <div class="auth-footer-link">
        By registering, you agree to Lumière’s <a href="#">Terms of Service</a> &amp; <a href="#">Privacy Policy</a>.
      </div>
    </form>

    <!-- 3. FORGOT PASSWORD FORM -->
    <form id="forgotForm" onsubmit="handleForgot(event)" style="display: none;">
      <p style="font-size: 0.82rem; color: rgba(250,247,242,0.7); line-height: 1.5; margin-bottom: 1.5rem;">
        Enter your registered email address and we will generate a secure reset token for your account.
      </p>

      <div class="form-group">
        <label class="form-label" for="forgotEmail">Email Address</label>
        <input type="email" id="forgotEmail" class="form-input" placeholder="yourname@domain.com" required />
      </div>

      <button type="submit" class="auth-btn-primary">
        SEND RESET CODE &rarr;
      </button>

      <div class="auth-footer-link">
        Remembered password? <a onclick="switchAuthTab('signin')">Sign In</a>
      </div>
    </form>

    <!-- 4. RESET PASSWORD FORM -->
    <form id="resetForm" onsubmit="handleReset(event)" style="display: none;">
      <div class="form-group">
        <label class="form-label" for="resetToken">Reset Token</label>
        <input type="text" id="resetToken" class="form-input" placeholder="Paste 64-char token" required />
      </div>

      <div class="form-group">
        <label class="form-label" for="resetNewPassword">New Password (8+ chars)</label>
        <input type="password" id="resetNewPassword" class="form-input" placeholder="••••••••••••" required minlength="8" />
      </div>

      <button type="submit" class="auth-btn-primary">
        SET NEW PASSWORD &rarr;
      </button>

      <div class="auth-footer-link">
        <a onclick="switchAuthTab('signin')">&larr; Return to Sign In</a>
      </div>
    </form>

  </main>

  <!-- Toast Element -->
  <div class="lumiere-toast" id="lumiereToast">
    <span style="color: var(--color-gold);">✦</span>
    <span id="toastMessage"></span>
  </div>

  <script src="js/auth.js"></script>
  <script>
    // Tab switcher logic
    function switchAuthTab(tab) {
      document.getElementById('signInForm').style.display = tab === 'signin' ? 'block' : 'none';
      document.getElementById('registerForm').style.display = tab === 'register' ? 'block' : 'none';
      document.getElementById('forgotForm').style.display = tab === 'forgot' ? 'block' : 'none';
      document.getElementById('resetForm').style.display = tab === 'reset' ? 'block' : 'none';

      document.getElementById('tabSignIn').classList.toggle('active', tab === 'signin');
      document.getElementById('tabRegister').classList.toggle('active', tab === 'register');
      clearAlert();
    }

    function showAlert(msg, isError = true) {
      const el = document.getElementById('authAlert');
      el.style.display = 'block';
      el.style.backgroundColor = isError ? 'rgba(226, 85, 110, 0.12)' : 'rgba(46, 204, 113, 0.12)';
      el.style.color = isError ? '#FF8A9E' : '#7bed9f';
      el.style.border = `1px solid ${isError ? 'rgba(226, 85, 110, 0.3)' : 'rgba(46, 204, 113, 0.3)'}`;
      el.innerHTML = msg;
    }

    function clearAlert() {
      const el = document.getElementById('authAlert');
      el.style.display = 'none';
    }

    function fillDemo(email, pass) {
      switchAuthTab('signin');
      document.getElementById('loginEmail').value = email;
      document.getElementById('loginPassword').value = pass;
    }

    function getApiBase() {
      if (window.location.protocol === 'file:') return 'http://localhost:5000';
      if (window.location.port === '5000' || window.location.hostname.includes('vercel.app')) return '';
      return 'http://localhost:5000';
    }

    async function safeApiFetch(endpoint, body) {
      const fullUrl = getApiBase() + endpoint;
      let res;
      try {
        res = await fetch(fullUrl, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body),
        });
      } catch (networkErr) {
        throw new Error('Cannot connect to Lumière backend service. Please verify the server is running on port 5000.');
      }

      const contentType = res.headers.get('content-type') || '';
      let data = null;

      if (contentType.includes('application/json')) {
        try {
          data = await res.json();
        } catch {
          data = null;
        }
      } else {
        const text = await res.text();
        if (!res.ok) {
          throw new Error(`Server returned HTTP ${res.status}: ${text || res.statusText}`);
        }
      }

      if (!data) {
        throw new Error('Server returned an unexpected response format. Please try again.');
      }

      if (!res.ok || !data.success) {
        throw new Error(data.error || data.message || 'Operation failed');
      }

      return data;
    }

    // Sign in handler
    async function handleSignIn(e) {
      e.preventDefault();
      clearAlert();
      const email = document.getElementById('loginEmail').value.trim();
      const password = document.getElementById('loginPassword').value;
      const btn = document.getElementById('loginSubmitBtn');
      btn.disabled = true;
      btn.innerText = 'AUTHENTICATING...';

      try {
        const data = await safeApiFetch('/api/auth/login', { email, password });

        Auth.setSession(data.token, data.user);
        showAlert(`✦ ${data.message}`, false);

        setTimeout(() => {
          if (data.user && data.user.isStaff) {
            window.location.href = 'admin/index.html';
          } else {
            window.location.href = 'account.html';
          }
        }, 600);
      } catch (err) {
        showAlert(err.message);
      } finally {
        btn.disabled = false;
        btn.innerText = 'SIGN IN →';
      }
    }

    // Register handler
    async function handleRegister(e) {
      e.preventDefault();
      clearAlert();
      const firstName = document.getElementById('regFirstName').value.trim();
      const lastName = document.getElementById('regLastName').value.trim();
      const email = document.getElementById('regEmail').value.trim();
      const phone = document.getElementById('regPhone').value.trim();
      const password = document.getElementById('regPassword').value;

      const btn = document.getElementById('registerSubmitBtn');
      btn.disabled = true;
      btn.innerText = 'CREATING ACCOUNT...';

      try {
        const data = await safeApiFetch('/api/auth/signup', { firstName, lastName, email, phone, password });

        Auth.setSession(data.token, data.user);
        showAlert(`✦ ${data.message}`, false);

        setTimeout(() => {
          window.location.href = 'account.html';
        }, 600);
      } catch (err) {
        showAlert(err.message);
      } finally {
        btn.disabled = false;
        btn.innerText = 'CREATE ACCOUNT →';
      }
    }

    // Forgot password handler
    async function handleForgot(e) {
      e.preventDefault();
      clearAlert();
      const email = document.getElementById('forgotEmail').value.trim();

      try {
        const data = await safeApiFetch('/api/auth/forgot-password', { email });

        if (data.resetToken) {
          showAlert(`Reset token generated: <code>${data.resetToken}</code>`, false);
          document.getElementById('resetToken').value = data.resetToken;
          setTimeout(() => switchAuthTab('reset'), 2500);
        } else {
          showAlert(data.message, false);
        }
      } catch (err) {
        showAlert(err.message);
      }
    }

    // Reset password handler
    async function handleReset(e) {
      e.preventDefault();
      clearAlert();
      const token = document.getElementById('resetToken').value.trim();
      const newPassword = document.getElementById('resetNewPassword').value;

      try {
        const data = await safeApiFetch('/api/auth/reset-password', { token, newPassword });

        showAlert(data.message, false);
        setTimeout(() => switchAuthTab('signin'), 1500);
      } catch (err) {
        showAlert(err.message);
      }
    }

    // Auto check if already logged in
    document.addEventListener('DOMContentLoaded', () => {
      if (Auth.isLoggedIn()) {
        const user = Auth.getUser();
        if (user && user.roles && user.roles.some(r => ['OWNER', 'MANAGER', 'INVENTORY_STAFF', 'ORDER_STAFF'].includes(r))) {
          showAlert(`You are logged in as <strong>${user.email}</strong>. <a href="admin/index.html">Enter Admin Portal &rarr;</a>`, false);
        } else {
          showAlert(`You are signed in as <strong>${user.email}</strong>. <a href="account.html">View Account &rarr;</a>`, false);
        }
      }
    });
  </script>
</body>
</html>
