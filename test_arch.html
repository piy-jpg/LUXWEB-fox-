<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<title>Arch Test</title>
<style>
  body { background: #0B080A; color: #fff; padding: 40px; font-family: sans-serif; display: flex; justify-content: center; gap: 20px; }
  .arch-card {
    position: relative;
    width: 240px;
    height: 320px;
    display: block;
    text-decoration: none;
    transition: transform 0.4s ease;
  }
  .arch-card:hover {
    transform: translateY(-8px);
  }
  .arch-svg {
    width: 100%;
    height: 100%;
    overflow: visible;
    filter: drop-shadow(0 14px 32px rgba(0,0,0,0.6));
  }
  .arch-image {
    transition: transform 0.6s cubic-bezier(0.16, 1, 0.3, 1);
    transform-origin: center center;
  }
  .arch-card:hover .arch-image {
    transform: scale(1.08);
  }
  .arch-title-wrap {
    position: absolute;
    bottom: 24px;
    left: 0;
    right: 0;
    text-align: center;
    z-index: 5;
    pointer-events: none;
  }
  .arch-title {
    font-family: 'Cormorant Garamond', Georgia, serif;
    font-size: 1.55rem;
    font-weight: 500;
    color: #E8D3B0;
    letter-spacing: 0.03em;
    margin: 0;
    text-shadow: 0 2px 10px rgba(0,0,0,0.8), 0 0 20px rgba(0,0,0,0.9);
  }
  .arch-sub {
    font-size: 0.72rem;
    letter-spacing: 0.18em;
    color: #C8A97E;
    text-transform: uppercase;
    margin-top: 4px;
  }
</style>
</head>
<body>
  <div class="arch-card">
    <svg class="arch-svg" viewBox="0 0 300 400" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="archGold" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#FAF7F2"/>
          <stop offset="35%" stop-color="#E0C294"/>
          <stop offset="70%" stop-color="#C8A97E"/>
          <stop offset="100%" stop-color="#8E6E40"/>
        </linearGradient>
        <linearGradient id="archVignette" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="rgba(11,8,10,0)"/>
          <stop offset="40%" stop-color="rgba(11,8,10,0.3)"/>
          <stop offset="75%" stop-color="rgba(11,8,10,0.85)"/>
          <stop offset="100%" stop-color="rgba(11,8,10,0.96)"/>
        </linearGradient>
        <clipPath id="archClip">
          <path d="M 150,16 C 158,22 174,38 186,56 L 186,68 L 200,68 A 32,32 0 0,1 232,114 L 232,126 L 246,126 A 36,36 0 0,1 268,178 L 268,190 L 284,190 L 284,364 A 24,24 0 0,1 260,388 L 40,388 A 24,24 0 0,1 16,364 L 16,190 L 32,190 L 32,178 A 36,36 0 0,1 54,126 L 68,126 L 68,114 A 32,32 0 0,1 100,68 L 114,68 L 114,56 C 126,38 142,22 150,16 Z" />
        </clipPath>
      </defs>
      <g clip-path="url(#archClip)">
        <image class="arch-image" href="frontend/images/category_1_skincare_34.jpg" x="0" y="0" width="300" height="400" preserveAspectRatio="xMidYMid slice"/>
        <rect x="0" y="160" width="300" height="240" fill="url(#archVignette)"/>
      </g>
      <!-- Dual Gold Border Contour -->
      <path d="M 150,16 C 158,22 174,38 186,56 L 186,68 L 200,68 A 32,32 0 0,1 232,114 L 232,126 L 246,126 A 36,36 0 0,1 268,178 L 268,190 L 284,190 L 284,364 A 24,24 0 0,1 260,388 L 40,388 A 24,24 0 0,1 16,364 L 16,190 L 32,190 L 32,178 A 36,36 0 0,1 54,126 L 68,126 L 68,114 A 32,32 0 0,1 100,68 L 114,68 L 114,56 C 126,38 142,22 150,16 Z" fill="none" stroke="url(#archGold)" stroke-width="3" stroke-linejoin="round"/>
    </svg>
    <div class="arch-title-wrap">
      <h3 class="arch-title">Skincare</h3>
      <div class="arch-sub">16 Essentials</div>
    </div>
  </div>
</body>
</html>
