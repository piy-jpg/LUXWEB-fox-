<!DOCTYPE html>
<html>
<head>
<style>
  body { background: #0B080A; color: #FAF7F2; font-family: sans-serif; display: flex; justify-content: center; gap: 40px; padding: 60px; }
  .box { text-align: center; }
  
  /* Style 1: Stadium / Capsule Cylinder (Border-radius: 999px) */
  .capsule-card {
    position: relative;
    width: 240px;
    height: 380px;
    border-radius: 120px;
    overflow: hidden;
    border: 2px solid rgba(200, 169, 126, 0.5);
    box-shadow: 0 16px 36px rgba(0,0,0,0.6), inset 0 0 20px rgba(200, 169, 126, 0.15);
  }
  .capsule-img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }
  .cylindrical-sheen {
    position: absolute;
    inset: 0;
    background: linear-gradient(90deg, 
      rgba(0,0,0,0.4) 0%, 
      rgba(255,255,255,0.08) 35%, 
      rgba(255,255,255,0.18) 50%, 
      rgba(255,255,255,0.04) 65%, 
      rgba(0,0,0,0.4) 100%);
    pointer-events: none;
  }

  /* Style 2: Geometric Perspective Cylinder (SVG) */
  .cylinder-svg-card {
    width: 240px;
    height: 380px;
  }
</style>
</head>
<body>
  <div class="box">
    <h3>Style 1: Luxury Cylindrical Capsule</h3>
    <div class="capsule-card">
      <img class="capsule-img" src="frontend/images/category_1_skincare_34.jpg"/>
      <div class="cylindrical-sheen"></div>
    </div>
  </div>
  <div class="box">
    <h3>Style 2: Column / Plinth Cylinder (SVG)</h3>
    <svg class="cylinder-svg-card" viewBox="0 0 240 380">
      <defs>
        <clipPath id="cylClip">
          <!-- Cylinder path with top ellipse and bottom ellipse -->
          <path d="
            M 10,40
            A 110,30 0 0,1 230,40
            L 230,340
            A 110,30 0 0,1 10,340
            Z
          "/>
        </clipPath>
        <linearGradient id="goldCyl" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0%" stop-color="#8E6E40"/>
          <stop offset="30%" stop-color="#FAF7F2"/>
          <stop offset="60%" stop-color="#C8A97E"/>
          <stop offset="100%" stop-color="#705026"/>
        </linearGradient>
      </defs>
      <!-- Base Cylinder Image -->
      <image href="frontend/images/category_1_skincare_34.jpg" width="240" height="380" preserveAspectRatio="xMidYMid slice" clip-path="url(#cylClip)"/>
      <!-- Cylinder Top Rim -->
      <ellipse cx="120" cy="40" rx="110" ry="30" fill="none" stroke="url(#goldCyl)" stroke-width="2.5"/>
      <!-- Cylinder Bottom Rim & Sides -->
      <path d="M 10,40 L 10,340 A 110,30 0 0,0 230,340 L 230,40" fill="none" stroke="url(#goldCyl)" stroke-width="2.5"/>
    </svg>
  </div>
</body>
</html>
